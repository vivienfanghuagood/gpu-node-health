apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Kept out of deploy/base on purpose. Everything in deploy/base is opt-in per
# node via the gpu-health.amd.io/agent label and affects only nodes that asked
# for it. This one is fleet-wide and changes kernel tunables on nodes carrying
# other people's services, so it is a separate, deliberate `apply -k`.
resources:
  - inotify-limits.yaml
