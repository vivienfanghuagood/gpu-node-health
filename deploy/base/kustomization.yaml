apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# No global `namespace:` transformer here on purpose: it would rewrite the
# exporter-discovery Role/RoleBinding out of kube-amd-gpu and into
# gpu-node-health, silently costing the agent its endpoint-discovery
# permission (observed as a 403 on the live node). Every manifest carries
# its own namespace.
resources:
  - namespace.yaml
  - rbac.yaml
  - agent-daemonset.yaml
