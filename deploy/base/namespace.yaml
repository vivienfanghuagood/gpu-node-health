apiVersion: v1
kind: Namespace
metadata:
  name: gpu-node-health
  labels:
    app.kubernetes.io/part-of: gpu-node-health
    # The agent needs hostPID and a read-only /var/log mount. Declare the
    # intent explicitly rather than discovering it as an admission rejection
    # at rollout time.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
