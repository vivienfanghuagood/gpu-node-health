    """Prometheus text exposition for the guard.
    
    Same hand-rolled approach as the agent, for the same reason: no third-party
    dependency on a component that has to work while the cluster is unhealthy.
    
    The series that matter most are the refusals. `gpuguard_decision` carries the
    reason as a label, so `gpuguard_decision{reason="capacity-floor"}` firing is an
    alertable statement - "something is sick enough to cordon and I am not allowed
    to" - which is a page-a-human event, not a quiet log line.
    """
    
    PREFIX = "gpuguard"
    
    
    def _esc(value):
        return (
            str(value)
            .replace("\\", "\\\\")
            .replace('"', '\\"')
            .replace("\n", "\\n")
        )
    
    
    class Registry:
        def __init__(self):
            self._lines = []
            self._declared = set()
    
        def metric(self, name, value, labels=None, mtype="gauge", help_text=""):
            full = f"{PREFIX}_{name}"
            if full not in self._declared:
                if help_text:
                    self._lines.append(f"# HELP {full} {help_text}")
                self._lines.append(f"# TYPE {full} {mtype}")
                self._declared.add(full)
            rendered = ",".join(f'{k}="{_esc(v)}"' for k, v in (labels or {}).items())
            suffix = f"{{{rendered}}}" if rendered else ""
            self._lines.append(f"{full}{suffix} {value}")
    
        def render(self):
            return "\n".join(self._lines) + "\n"
    
    
    def render(state):
        """`state` is the dict main.py keeps; see _snapshot there."""
        r = Registry()
    
        r.metric("up", 1, help_text="gpu-node-guard process is serving.")
        r.metric(
            "is_leader", 1 if state.get("is_leader") else 0,
            help_text="1 on the replica currently holding the lease. Only the "
                      "leader evaluates or acts.",
        )
        r.metric(
            "enforce_mode", 1 if state.get("mode") == "enforce" else 0,
            help_text="1 when GUARD_MODE=enforce. 0 means every decision below is "
                      "hypothetical.",
        )
        r.metric(
            "last_loop_timestamp_seconds", int(state.get("last_loop", 0)),
            help_text="Unix time of the last completed evaluation. Alert on this "
                      "going stale: a guard that stopped evaluating looks exactly "
                      "like a fleet with no problems.",
        )
        r.metric(
            "loop_errors_total", state.get("loop_errors", 0), mtype="counter",
            help_text="Evaluation loops that raised.",
        )
        r.metric(
            "event_errors_total", state.get("event_errors", 0), mtype="counter",
            help_text="Kubernetes Events the guard failed to record. Non-zero "
                      "means actions and refusals are happening unwitnessed.",
        )
        r.metric(
            "nodes_watched", state.get("nodes_watched", 0),
            help_text="Nodes matching the guard's label selector.",
        )
        r.metric(
            "healthy_capacity", state.get("healthy_capacity", 0),
            help_text="Nodes that are Ready, schedulable and not triggering a "
                      "cordon. This is what the capacity floor is measured "
                      "against.",
        )
        r.metric(
            "min_healthy_nodes", state.get("min_healthy_nodes", 0),
            help_text="Configured capacity floor.",
        )
        r.metric(
            "cordons_total", state.get("cordons_total", 0), mtype="counter",
            help_text="Cordons actually performed by this guard since start.",
        )
    
        # Standing facts about each watched node, published separately from the
        # decisions. A cordon is permanent (this guard never uncordons) while a
        # decision follows the conditions, which expire - so once the condition
        # clears, the node reads `healthy` while still being out of service. These
        # two series are the only thing that keeps saying so.
        for st in state.get("node_states", ()):
            r.metric(
                "node_unschedulable", st.unschedulable, labels={"node": st.node},
                help_text="1 while the node is cordoned, whoever cordoned it. This "
                          "guard never uncordons, so a 1 here persists until a "
                          "human clears it - which is exactly why it is a gauge "
                          "and not an increase() over the cordon counter.",
            )
            r.metric(
                "node_ready", st.ready, labels={"node": st.node},
                help_text="kubelet's own Ready condition. Stays 1 through a GPU "
                          "hang - recorded here so a dashboard can show that next "
                          "to the GPU conditions rather than beside them.",
            )
    
        for dec in state.get("decisions", ()):
            r.metric(
                "decision", 1,
                labels={
                    "node": dec.node,
                    "action": dec.action,
                    "reason": dec.reason,
                    "level": dec.level,
                    "condition": dec.condition,
                },
                help_text="Current decision per node, one series each. The "
                          "reason label is the interesting one - reason="
                          "\"capacity-floor\" or \"rate-limit\" means the guard "
                          "wanted to act and was not allowed to.",
            )
    
        for dec in state.get("exporter_decisions", ()):
            r.metric(
                "exporter_decision", 1,
                labels={
                    # NOT "pod". The scrape config sets `pod` to the target being
                    # scraped - which is the GUARD's own pod - so a `pod` label in
                    # the payload collides and Prometheus silently renames ours to
                    # `exported_pod`. Seen live on the first scrape. Same trap F9
                    # recorded for `node` on the agent job; the fix is to never let
                    # a payload label share a name with a relabelled one.
                    "exporter_pod": dec.pod,
                    "node": dec.node,
                    "action": dec.action,
                    "reason": dec.reason,
                },
                help_text="Current decision per metrics-exporter pod.",
            )
            r.metric(
                "exporter_unreachable_seconds", dec.unreachable_seconds,
                labels={"exporter_pod": dec.pod, "node": dec.node},
                help_text="How long this exporter's /metrics has been "
                          "unreachable. Reset only by a successful scrape - never "
                          "by a restart or a delete.",
            )
    
        return r.render()
  policy.py: |
    """What the guard is allowed to do, and why it is usually allowed to do nothing.
    
    This module is pure: it takes a parsed snapshot of the fleet and a clock, and
    returns a list of decisions. No HTTP, no clients, no clock of its own. That is
    deliberate - this is the code that can take a production node out of service on
    a cluster whose entire serving capacity is two nodes, so it has to be the code
    that is easiest to test against a hand-written scenario.
    
    The shape of the thing:
    
        conditions on a Node  ->  a trigger level  ->  guardrails  ->  a decision
    
    Every decision is returned, including the refusals. A guard that silently
    declines to act is the same failure mode this whole project exists to remove -
    silence reading as health - one level up. So "I would have cordoned 0029 but
    the capacity floor stopped me" is a first-class output with its own metric and
    its own Kubernetes Event, not a log line nobody reads.
    
    Two things this module will never emit:
    
    * a drain. Cordoning stops the bleeding by keeping new tenants off a sick node;
      draining tries to rescue the ones already on it, and on a wedged node the
      eviction will hang in D state anyway. Evicting 45 pods off 0029 on the
      strength of an automated signal is not a trade worth making unattended.
    * an uncordon. A node that recovered still has to pass a human and a smoke
      test before it takes traffic again. Automatic recovery is how a flapping
      signal turns into a flapping fleet.
    """
    
    import collections
    
    # Condition types published by gpu-health-agent (agent/gpu_health_agent/conditions.py).
    GPU_UNRECOVERABLE = "gpu-health.amd.io/GPUUnrecoverable"
    GPU_WORKQUEUE_STALLED = "gpu-health.amd.io/GPUWorkqueueStalled"
    GPU_ENGINE_TIMEOUT = "gpu-health.amd.io/GPUEngineTimeout"
    GPU_PROBE_FAILED = "gpu-health.amd.io/GPUProbeFailed"
    GPU_HEALTH_DATA_STALE = "gpu-health.amd.io/GPUHealthDataStale"
    
    # Level -> the conditions that trigger it, in descending severity. The mapping
    # comes from the plan's L1-L4 table, minus the parts that require draining.
    #
    # L3 is the "stop the bleeding now" level: the node is in, or is entering, the
    # state the August incidents ended in. L2 is "this is recurring, stop feeding
    # it". L1 is a single card and is reported only - taking a whole 8-GPU node out
    # of service because one card failed a probe costs more than it saves, and the
    # device plugin is the right place to fix that.
    LEVEL_RULES = (
        ("L3", (GPU_UNRECOVERABLE, GPU_WORKQUEUE_STALLED)),
        ("L2", (GPU_ENGINE_TIMEOUT,)),
        ("L1", (GPU_PROBE_FAILED,)),
    )
    
    CORDON_LEVELS = frozenset({"L2", "L3"})
    
    # Decision actions.
    CORDON = "cordon"
    NOOP = "noop"
    
    # Why a decision came out the way it did. These strings are metric label values
    # and Event reasons, so they are part of the interface - renaming one breaks
    # dashboards and alert rules.
    R_HEALTHY = "healthy"
    R_ALREADY_CORDONED = "already-cordoned"
    R_REPORT_ONLY = "report-only-level"
    R_TOO_YOUNG = "condition-too-young"
    R_STALE_DATA = "health-data-stale"
    R_OBSERVE_MODE = "observe-mode"
    R_OUT_OF_SCOPE = "not-in-enforce-scope"
    R_CAPACITY_FLOOR = "capacity-floor"
    R_RATE_LIMIT = "rate-limit"
    R_CORDON = "cordon"
    # There is deliberately no R_WOULD_CORDON. One existed, was never emitted by
    # any code path, and an alert rule matched it anyway - so the most important
    # rule in observe mode ("this node WOULD have been cordoned") could never fire.
    # Every other reason here answers "why did it come out this way", and the
    # observe-mode answer to that is observe-mode. Keep them all one kind of thing.
    
    Decision = collections.namedtuple(
        "Decision", "node action reason level condition message"
    )
    
    
    def _condition_index(node):
        return {
            c.get("type"): c
            for c in ((node.get("status") or {}).get("conditions") or [])
            if c.get("type")
        }
    
    
    def _is_true(cond):
        return (cond or {}).get("status") == "True"
    
    
    def _schedulable(node):
        return not ((node.get("spec") or {}).get("unschedulable"))
    
    
    def _ready(node):
        return _is_true(_condition_index(node).get("Ready"))
    
    
    def trigger_level(node, now, min_age_seconds, parse_time):
        """Highest level this node currently triggers, with the condition behind it.
    
        Returns (level, condition_dict) or (None, None).
    
        A condition only counts once it has held for `min_age_seconds`. There is no
        separate streak counter for this: the agent advances `lastTransitionTime`
        only on an actual flip, so the age of that timestamp already IS the dwell
        time, and reusing it keeps the debounce honest across guard restarts. A
        guard that reset its own streak counter every time its pod was rescheduled
        would debounce nothing.
        """
        index = _condition_index(node)
        for level, types in LEVEL_RULES:
            for ctype in types:
                cond = index.get(ctype)
                if not _is_true(cond):
                    continue
                since = parse_time(cond.get("lastTransitionTime"))
                if since is None or (now - since) < min_age_seconds:
                    return level, dict(cond, _too_young=True)
                return level, cond
        return None, None
    
    
    def healthy_capacity(nodes, now, min_age_seconds, parse_time, exclude=()):
        """Nodes that are Ready, schedulable, and not currently triggering a cordon.
    
        This is the number the capacity floor is measured against. It counts what
        would still be able to take work, not what merely exists: a node that is
        Ready and schedulable but already screaming GPUUnrecoverable is not spare
        capacity, and counting it as such is how a guard talks itself into
        cordoning the last good node.
        """
        count = 0
        for node in nodes:
            name = (node.get("metadata") or {}).get("name")
            if name in exclude:
                continue
            if not _ready(node) or not _schedulable(node):
                continue
            level, _ = trigger_level(node, now, min_age_seconds, parse_time)
            if level in CORDON_LEVELS:
                continue
            count += 1
        return count
    
    
    NodeState = collections.namedtuple("NodeState", "node unschedulable ready")
    
    
    def node_states(nodes):
        """Schedulability and readiness per node - facts, not decisions.
    
        This is separate from `decide` on purpose. A decision describes what the
        guard wants to do *right now*, and it is driven by the conditions, which
        expire on a 15-minute activity window. A cordon does not expire: this guard
        never uncordons, by design. So the moment the condition clears, the node's
        decision goes back to `healthy` while the node is still out of service, and
        the only alert that ever mentioned it was an `increase(cordons_total[10m])`
        that resolved long before.
    
        Measured on 0024 2026-09-17: cordoned 07:46:28, condition cleared 07:59:12,
        decision back to `healthy` at 07:59:28, node still unschedulable. Thirteen
        minutes from removing a node from service to nothing anywhere saying so.
    
        That is this project's founding failure mode - silence reading as health -
        except the missing capacity is now our own doing, which makes it worse
        rather than better. A permanent action needs a standing signal, not an
        edge-triggered one.
        """
        out = []
        for node in nodes:
            name = (node.get("metadata") or {}).get("name", "")
            out.append(NodeState(
                name,
                0 if _schedulable(node) else 1,
                1 if _ready(node) else 0,
            ))
        return out
    
    
    def decide(nodes, now, cfg, parse_time, recent_cordons=()):
        """Return a Decision for every node in `nodes`.
    
        `recent_cordons` is a sequence of timestamps of cordons this guard has
        already performed; it drives the rate limit. It is held by the caller
        rather than here so this function stays pure.
        """
        budget = cfg.max_cordons_per_window - sum(
            1 for ts in recent_cordons if now - ts < cfg.rate_limit_window_seconds
        )
        decisions = []
    
        for node in nodes:
            name = (node.get("metadata") or {}).get("name", "")
            index = _condition_index(node)
            level, cond = trigger_level(node, now, cfg.condition_min_age_seconds, parse_time)
            ctype = (cond or {}).get("type", "")
            cmsg = (cond or {}).get("message", "")
    
            def d(action, reason, message):
                return Decision(name, action, reason, level or "", ctype, message)
    
            if level is None:
                decisions.append(d(NOOP, R_HEALTHY, "no GPU health condition active"))
                continue
    
            if cond.get("_too_young"):
                decisions.append(d(
                    NOOP, R_TOO_YOUNG,
                    f"{ctype} is active but has held for less than "
                    f"{cfg.condition_min_age_seconds}s",
                ))
                continue
    
            if level not in CORDON_LEVELS:
                decisions.append(d(
                    NOOP, R_REPORT_ONLY,
                    f"{ctype} is a {level} signal: reported, never cordoned. A "
                    f"single failed card does not justify removing 8. ({cmsg})",
                ))
                continue
    
            # Refuse to act on a node whose health data is admittedly broken. This
            # is the one guardrail that is not about capacity: GPUHealthDataStale
            # means the agent is telling us its own inputs are unreliable, and
            # acting on unreliable inputs is worse than not acting. Note the
            # ordering - this is checked BEFORE the mode check, so it shows up in
            # observe mode too, where it is free to discover.
            if _is_true(index.get(GPU_HEALTH_DATA_STALE)):
                decisions.append(d(
                    NOOP, R_STALE_DATA,
                    f"{ctype} is active but so is GPUHealthDataStale - the agent "
                    f"says its own data is unreliable, so this is not actioned. "
                    f"This needs a human, not a cordon.",
                ))
                continue
    
            if not _schedulable(node):
                decisions.append(d(
                    NOOP, R_ALREADY_CORDONED,
                    f"{ctype} is active and the node is already unschedulable",
                ))
                continue
    
            remaining = healthy_capacity(
                nodes, now, cfg.condition_min_age_seconds, parse_time, exclude=(name,)
            )
            if remaining < cfg.min_healthy_nodes:
                decisions.append(d(
                    NOOP, R_CAPACITY_FLOOR,
                    f"{ctype} is active on {name}, but cordoning it would leave "
                    f"{remaining} healthy schedulable node(s), below the floor of "
                    f"{cfg.min_healthy_nodes}. Refusing, and alerting instead. "
                    f"({cmsg})",
                ))
                continue
    
            if budget <= 0:
                decisions.append(d(
                    NOOP, R_RATE_LIMIT,
                    f"{ctype} is active on {name}, but "
                    f"{cfg.max_cordons_per_window} cordon(s) already happened "
                    f"within {cfg.rate_limit_window_seconds}s. More than that at "
                    f"once is a fleet-wide event, which is a human's call. ({cmsg})",
                ))
                continue
    
            if cfg.mode != "enforce":
                decisions.append(d(
                    NOOP, R_OBSERVE_MODE,
                    f"WOULD CORDON {name}: {ctype} active and every guardrail "
                    f"passed. GUARD_MODE is observe, so nothing was done. ({cmsg})",
                ))
                continue
    
            # Scope is checked after the mode and after every guardrail, so a node
            # outside it produces the same complete dry-run record as observe mode
            # does - same guardrails evaluated, same "would have" finding, just a
            # different reason for the inaction. Checking it earlier would hide
            # whether the capacity floor or the rate limit would also have stopped
            # this, which is precisely what a staged rollout needs to know before
            # widening the scope.
            if cfg.enforce_nodes and name not in cfg.enforce_nodes:
                decisions.append(d(
                    NOOP, R_OUT_OF_SCOPE,
                    f"WOULD CORDON {name}: {ctype} active and every guardrail "
                    f"passed, and GUARD_MODE is enforce - but {name} is not in "
                    f"GUARD_ENFORCE_NODES, so nothing was done. ({cmsg})",
                ))
                continue
    
            budget -= 1
            decisions.append(d(
                CORDON, R_CORDON,
                f"cordoned {name}: {ctype} active. New pods will not be scheduled "
                f"here. Existing pods are left alone - this guard never drains, "
                f"and never uncordons. ({cmsg})",
            ))
    
        return decisions
  supervisor.py: |
    """External liveness for the AMD metrics-exporter DaemonSet.
    
    The operator's exporter has no readiness probe and no liveness probe, its PID 1
    is a `bash` wrapper that stays `sleeping` after its `gpuagent` child becomes a
    zombie, and the DaemonSet is owner-referenced by the `DeviceConfig` CRD - so a
    patch adding a probe is reconciled away, and the CRD has no field for one. On
    this cluster three of five exporters died that way, weeks apart, and every one
    of them stayed `1/1 Running` and stayed a Ready endpoint of the Service.
    
    So the probe has to be bolted on from outside. That is what this is.
    
    The judgement it encodes: **"the pod is Running" is not evidence, and "I
    deleted the pod" is not proof of recovery.** On 0004 the pod cannot be deleted
    at all - a task wedged in the amdgpu driver holds the container open and
    containerd returns DeadlineExceeded forever. A supervisor that assumed its
    delete worked would sit there congratulating itself. So a delete is recorded as
    an attempt, the pod is put on cooldown, and the unreachable clock keeps running
    until a scrape actually succeeds.
    """
    
    import collections
    
    DELETE = "delete"
    NOOP = "noop"
    
    R_REACHABLE = "reachable"
    R_NOT_RUNNING = "not-running"
    R_NO_POD_IP = "no-pod-ip"
    R_WITHIN_GRACE = "within-grace"
    R_COOLDOWN = "cooldown"
    R_DISABLED = "supervision-disabled"
    R_WOULD_DELETE = "would-delete"
    R_DELETE = "delete"
    
    PodDecision = collections.namedtuple(
        "PodDecision", "pod node action reason unreachable_seconds message"
    )
    
    
    class ExporterSupervisor:
        def __init__(self, cfg, scrape):
            """`scrape(url) -> bool` returns True if the exporter answered."""
            self._cfg = cfg
            self._scrape = scrape
            self._unreachable_since = {}   # pod name -> first failure timestamp
            self._last_delete = {}         # node name -> timestamp
    
        def _url(self, ip):
            return f"http://{ip}:{self._cfg.EXPORTER_PORT}/metrics"
    
        def evaluate(self, pods, now):
            decisions = []
            live = set()
    
            for pod in pods:
                meta = pod.get("metadata") or {}
                status = pod.get("status") or {}
                spec = pod.get("spec") or {}
                name = meta.get("name", "")
                node = spec.get("nodeName", "")
                live.add(name)
    
                def d(action, reason, message, since=None):
                    elapsed = 0 if since is None else round(now - since, 1)
                    return PodDecision(name, node, action, reason, elapsed, message)
    
                if status.get("phase") != "Running":
                    # Not our problem: the kubelet is already reporting this one
                    # honestly, and something else will restart it.
                    self._unreachable_since.pop(name, None)
                    decisions.append(d(NOOP, R_NOT_RUNNING,
                                       f"phase={status.get('phase')}"))
                    continue
    
                ip = status.get("podIP")
                if not ip:
                    self._unreachable_since.pop(name, None)
                    decisions.append(d(NOOP, R_NO_POD_IP, "Running with no podIP yet"))
                    continue
    
                if self._scrape(self._url(ip)):
                    # The only thing that clears the clock. Not a restart, not a
                    # delete, not a Running phase - an actual answer on the wire.
                    self._unreachable_since.pop(name, None)
                    decisions.append(d(NOOP, R_REACHABLE, f"{self._url(ip)} answered"))
                    continue
    
                since = self._unreachable_since.setdefault(name, now)
                elapsed = now - since
    
                if elapsed < self._cfg.EXPORTER_UNREACHABLE_SECONDS:
                    decisions.append(d(
                        NOOP, R_WITHIN_GRACE,
                        f"unreachable for {elapsed:.0f}s, grace is "
                        f"{self._cfg.EXPORTER_UNREACHABLE_SECONDS}s",
                        since,
                    ))
                    continue
    
                last = self._last_delete.get(node)
                if last is not None and (now - last) < self._cfg.EXPORTER_DELETE_COOLDOWN_SECONDS:
                    decisions.append(d(
                        NOOP, R_COOLDOWN,
                        f"unreachable for {elapsed:.0f}s but an exporter pod on "
                        f"{node} was already deleted {now - last:.0f}s ago. "
                        f"Deleting again would be a loop - on a node wedged in the "
                        f"driver the delete cannot complete at all.",
                        since,
                    ))
                    continue
    
                if not self._cfg.EXPORTER_SUPERVISION_ENABLED:
                    decisions.append(d(
                        NOOP, R_DISABLED,
                        f"unreachable for {elapsed:.0f}s. Supervision is off, so "
                        f"nothing was deleted - this pod belongs to the AMD "
                        f"operator, not to us.",
                        since,
                    ))
                    continue
    
                if self._cfg.MODE != "enforce":
                    decisions.append(d(
                        NOOP, R_WOULD_DELETE,
                        f"WOULD DELETE {name}: unreachable for {elapsed:.0f}s. "
                        f"GUARD_MODE is observe.",
                        since,
                    ))
                    continue
    
                self._last_delete[node] = now
                decisions.append(d(
                    DELETE, R_DELETE,
                    f"deleting {name} on {node}: /metrics unreachable for "
                    f"{elapsed:.0f}s. The delete is an attempt, not a cure - the "
                    f"unreachable clock keeps running until a scrape succeeds.",
                    since,
                ))
    
            # Forget pods that no longer exist, so a churning DaemonSet cannot grow
            # this dict without bound.
            for gone in set(self._unreachable_since) - live:
                self._unreachable_since.pop(gone, None)
    
            return decisions
