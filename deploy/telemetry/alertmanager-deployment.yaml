apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: amd-telemetry
  labels:
    app: alertmanager
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alertmanager
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: alertmanager
    spec:
      # Same broken-clusterDNS workaround as vmagent; see the comment there.
      dnsPolicy: None
      dnsConfig:
        nameservers: ["10.233.0.10"]
        searches:
          - amd-telemetry.svc.amd.gpu.dc
          - svc.amd.gpu.dc
          - amd.gpu.dc
        options:
          - name: ndots
            value: "5"
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
      containers:
        - name: alertmanager
          image: 10.5.10.12:1808/radeon-cloud-global/alertmanager:v0.27.0@sha256:5b558215662c96a36532f1096f459fbccbeb9fdb3b5572f509f7b1fac421bd7a
          imagePullPolicy: IfNotPresent
          args:
            - --config.file=/etc/alertmanager/alertmanager.yml
            - --storage.path=/alertmanager
            - --web.listen-address=:9093
          ports:
            - name: http
              containerPort: 9093
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /etc/alertmanager
              readOnly: true
            - name: data
              mountPath: /alertmanager
      volumes:
        - name: config
          configMap:
            name: alertmanager-config
        - name: data
          # Silences and notification state do not survive a restart. That is
          # an accepted trade for now: the alternative is a hostPath that pins
          # this pod to one node, which is already how VictoriaMetrics lost
          # its portability here.
          emptyDir:
            sizeLimit: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
  namespace: amd-telemetry
  labels:
    app: alertmanager
spec:
  type: ClusterIP
  selector:
    app: alertmanager
  ports:
    - name: http
      port: 9093
      targetPort: http
