apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# No global `namespace:` transformer here, same reason as deploy/base: it
# rewrites resources that deliberately live in another namespace. Every
# manifest carries its own.
resources:
  - vmagent-rbac.yaml
  - vmagent-deployment.yaml
  - kube-state-metrics.yaml
  - node-exporter.yaml
  - vmalert-deployment.yaml
  - alertmanager-deployment.yaml

# Hash-suffixed, so editing scrape.yaml produces a new ConfigMap name and
# rolls the Deployment. vmagent does not watch its config file, and a config
# that changed on disk while the process kept running the old one is the
# quietest way to believe you are collecting something you are not.
configMapGenerator:
  - name: vmagent-scrape-config
    namespace: amd-telemetry
    files:
      - scrape.yaml
  - name: gpu-alert-rules
    namespace: amd-telemetry
    files:
      - alerts.yaml
  - name: alertmanager-config
    namespace: amd-telemetry
    files:
      - alertmanager.yml

  # The two Grafana ConfigMaps are the exception to the hash-suffix rule
  # above, and deliberately so. They are referenced by fixed name from
  # grafana-dashboard-mount.patch.yaml, which is applied to a Deployment this
  # kustomization does not own, so kustomize cannot rewrite that reference.
  # A hash suffix would break the mount on the first dashboard edit.
  #
  # The reason a stable name is safe here and not for vmagent: Grafana's file
  # provider rescans its directory every 30s, so an edited dashboard is picked
  # up live. vmagent never re-reads its config, which is why that one must
  # force a rollout.
  - name: grafana-dashboard-gpu-health
    namespace: amd-telemetry
    options:
      disableNameSuffixHash: true
    files:
      - dashboards/gpu-node-health.json
      - dashboards/gpu-fleet.json
  - name: grafana-dashboards-provider-gpu-health
    namespace: amd-telemetry
    options:
      disableNameSuffixHash: true
    files:
      - gpu-health.yaml=dashboards/provider.yaml
