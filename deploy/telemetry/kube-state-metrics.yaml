# kube-state-metrics is here for one specific reason beyond the usual:
# kube_node_status_condition exports EVERY condition on a Node object,
# including the GPUUnrecoverable / GPUWorkqueueStalled / GPUHealthDataStale
# conditions this project publishes. That gives the alerting layer a second,
# independent view of node health - read off the API server rather than off
# the agent's own /metrics - so a broken agent cannot produce a clean board.
#
# It also exports kube_node_labels, which is what lets an alert know which
# nodes are SUPPOSED to be running the health agent. Without that, "the agent
# on node X disappeared" is indistinguishable from "node X was never enrolled".
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-state-metrics
  namespace: amd-telemetry
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kube-state-metrics
rules:
  - apiGroups: [""]
    resources: ["nodes", "pods", "services", "namespaces", "persistentvolumeclaims"]
    verbs: ["list", "watch"]
  - apiGroups: ["apps"]
    resources: ["daemonsets", "deployments", "replicasets", "statefulsets"]
    verbs: ["list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kube-state-metrics
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kube-state-metrics
subjects:
  - kind: ServiceAccount
    name: kube-state-metrics
    namespace: amd-telemetry
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-state-metrics
  namespace: amd-telemetry
  labels:
    app: kube-state-metrics
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kube-state-metrics
  template:
    metadata:
      labels:
        app: kube-state-metrics
    spec:
      serviceAccountName: kube-state-metrics
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
      containers:
        - name: kube-state-metrics
          image: 10.5.10.12:1808/radeon-cloud-global/kube-state-metrics:v2.13.0@sha256:697bee9945e0d38956b822a2bb43c4bca89d97eb03944d311402758903e67bd2
          imagePullPolicy: IfNotPresent
          args:
            # Narrowed to the resources the alerting layer actually joins on.
            # The default set would add tens of thousands of series to a
            # single-node VictoriaMetrics on a hostPath.
            - --resources=nodes,pods,daemonsets,deployments
            # Since KSM 2.x, kube_node_labels ships with no labels at all
            # unless they are allow-listed. Without this line the
            # GPUHealthAgentMissingOnNode rule would match nothing and fail
            # open - quietly, which is the worst way for a watchdog to fail.
            - --metric-labels-allowlist=nodes=[gpu-health.amd.io/agent]
          ports:
            - name: http
              containerPort: 8080
            - name: telemetry
              containerPort: 8081
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: telemetry
            initialDelaySeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: kube-state-metrics
  namespace: amd-telemetry
  labels:
    app: kube-state-metrics
spec:
  type: ClusterIP
  selector:
    app: kube-state-metrics
  ports:
    - name: http
      port: 8080
      targetPort: http
