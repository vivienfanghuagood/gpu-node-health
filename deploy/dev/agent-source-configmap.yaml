  k8s.py: |
    """Minimal in-cluster Kubernetes client (stdlib only).
    
    The agent needs exactly two calls - read a Node and patch its status
    conditions - so pulling in the full `kubernetes` package and its transitive
    dependency tree is not worth it on a DaemonSet that must stay boring.
    """
    
    import json
    import os
    import ssl
    import urllib.error
    import urllib.request
    
    SA_DIR = "/var/run/secrets/kubernetes.io/serviceaccount"
    
    
    class K8sError(Exception):
        pass
    
    
    class K8sClient:
        def __init__(self, sa_dir=SA_DIR):
            host = os.getenv("KUBERNETES_SERVICE_HOST")
            port = os.getenv("KUBERNETES_SERVICE_PORT", "443")
            if not host:
                raise K8sError("KUBERNETES_SERVICE_HOST unset - not running in-cluster")
            self._base = f"https://{host}:{port}"
    
            try:
                with open(os.path.join(sa_dir, "token")) as fh:
                    self._token = fh.read().strip()
            except OSError as exc:
                raise K8sError(f"cannot read service account token: {exc}") from exc
    
            ca = os.path.join(sa_dir, "ca.crt")
            self._ctx = ssl.create_default_context(cafile=ca if os.path.exists(ca) else None)
    
        def _request(self, method, path, body=None, content_type=None, timeout=10):
            url = self._base + path
            data = json.dumps(body).encode() if body is not None else None
            req = urllib.request.Request(url, data=data, method=method)
            req.add_header("Authorization", f"Bearer {self._token}")
            req.add_header("Accept", "application/json")
            if content_type:
                req.add_header("Content-Type", content_type)
            try:
                with urllib.request.urlopen(req, timeout=timeout, context=self._ctx) as resp:
                    return json.loads(resp.read().decode() or "{}")
            except urllib.error.HTTPError as exc:
                detail = exc.read().decode(errors="replace")[:400]
                raise K8sError(f"{method} {path} -> {exc.code}: {detail}") from exc
            except (urllib.error.URLError, OSError, ValueError) as exc:
                raise K8sError(f"{method} {path} failed: {exc}") from exc
    
        # -- surface used by the agent ----------------------------------------
    
        def get_node(self, name):
            return self._request("GET", f"/api/v1/nodes/{name}")
    
        def list_endpointslices(self, namespace, service):
            """EndpointSlices backing `service`.
    
            Used to find the AMD metrics exporter pod running on THIS node.
            Its Service is a plain ClusterIP, so scraping the service address
            would round-robin across every node's exporter and attribute another
            node's GPU health to this one. EndpointSlice endpoints carry
            `nodeName`, which lets us pick the local pod exactly.
            """
            return self._request(
                "GET",
                f"/apis/discovery.k8s.io/v1/namespaces/{namespace}/endpointslices"
                f"?labelSelector=kubernetes.io%2Fservice-name%3D{service}",
            )
    
        def patch_node_status_conditions(self, name, conditions):
            """Merge `conditions` into .status.conditions.
    
            Node conditions carry patchMergeKey=type, so a strategic merge patch
            updates matching entries in place and appends new ones without
            disturbing the conditions kubelet owns (Ready, MemoryPressure, ...).
            Never send a plain JSON merge patch here: that would replace the whole
            list and wipe the kubelet's conditions.
            """
            return self._request(
                "PATCH",
                f"/api/v1/nodes/{name}/status",
                body={"status": {"conditions": conditions}},
                content_type="application/strategic-merge-patch+json",
            )
  main.py: |
    """gpu-health-agent entrypoint.
    
    Runs on every GPU node as a DaemonSet. Collects the signals that were missing
    during the August GPU hang incidents, publishes them as Prometheus metrics,
    and - only when explicitly enabled - reflects them into Node conditions for
    gpu-node-guard to act on.
    
    The agent never evicts, cordons, or kills anything. Remediation is the guard's
    job, and the guard is a separate process with a separate ServiceAccount so
    that a bug in signal collection cannot take a node out of service.
    """
    
    import json
    import logging
    import signal
    import sys
    import threading
    import time
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
    
    from . import metrics
    from .conditions import ALL_CONDITIONS, ConditionEvaluator
    from .config import Config
    from .k8s import K8sClient, K8sError
    from .signals.dstate import DStateCensus
    from .signals.exporter import ExporterProbe, NodeLocalEndpointResolver
    from .signals.kernlog import KernelLogWatcher
    from .signals.patchctr import PatchCounters
    
    LOG = logging.getLogger("gpu-health-agent")
    
    CONDITION_PREFIX = "gpu-health.amd.io/"
    
    
    class LazyClient:
        """One in-cluster API client, built on first use and shared.
    
        Construction reads the ServiceAccount token, which does not exist outside
        a cluster. Deferring it keeps the agent runnable on a laptop (with
        EXPORTER_URL pinned and conditions disabled) instead of dying at startup.
        """
    
        def __init__(self):
            self._client = None
    
        def __call__(self):
            if self._client is None:
                self._client = K8sClient()
            return self._client
    
    
    class Collector:
        """Owns all signal sources and the most recent collected state."""
    
        def __init__(self, cfg, client_factory):
            self._cfg = cfg
            self._lock = threading.Lock()
            self._state = {"collected_at": 0, "collect_errors": 0}
    
            self._kernlog = (
                KernelLogWatcher(cfg.KERNLOG_PATHS) if cfg.KERNLOG_ENABLED else None
            )
            self._dstate = (
                DStateCensus(
                    cfg.PROC_PATH, cfg.DSTATE_STUCK_SECONDS, cfg.DSTATE_GPU_COMM_PREFIXES
                )
                if cfg.DSTATE_ENABLED else None
            )
            resolver = None
            if cfg.EXPORTER_ENABLED and not cfg.EXPORTER_URL:
                resolver = NodeLocalEndpointResolver(
                    client_factory,
                    cfg.EXPORTER_SERVICE_NAMESPACE,
                    cfg.EXPORTER_SERVICE_NAME,
                    cfg.NODE_NAME,
                    cfg.EXPORTER_PORT,
                    cfg.EXPORTER_METRICS_PATH,
                )
            self._exporter = (
                ExporterProbe(cfg.EXPORTER_URL, cfg.EXPORTER_TIMEOUT_SECONDS, resolver)
                if cfg.EXPORTER_ENABLED else None
            )
            self._patch = (
                PatchCounters(cfg.PATCH_COUNTERS_PATH)
                if cfg.PATCH_COUNTERS_ENABLED else None
            )
            self._evaluator = ConditionEvaluator()
    
        def start(self):
            if self._kernlog:
                self._kernlog.start()
    
        def state(self):
            with self._lock:
                return dict(self._state)
    
        def collect_once(self):
            started = time.monotonic()
            now = time.time()
            new = {"collected_at": now}
    
            try:
                new["kernlog"] = self._kernlog.snapshot() if self._kernlog else {}
                new["dstate"] = self._dstate.collect() if self._dstate else {}
                new["exporter"] = self._exporter.collect() if self._exporter else {}
                new["patch"] = self._patch.collect() if self._patch else {}
    
                evaluated = self._evaluator.evaluate(
                    now, new["kernlog"], new["dstate"], new["exporter"]
                )
                new["condition_detail"] = evaluated
                new["conditions"] = {k: v["active"] for k, v in evaluated.items()}
                errors = 0
            except Exception:
                # A crash in collection must not take the agent down: a dead agent
                # is indistinguishable from a healthy quiet one to anything
                # downstream, which is the exact failure mode this project exists
                # to eliminate. Stay up, count the error, and let
                # gpuhealth_collect_errors_total drive an alert.
                LOG.exception("collection pass failed")
                errors = 1
    
            with self._lock:
                prior_errors = self._state.get("collect_errors", 0)
                if errors:
                    self._state["collect_errors"] = prior_errors + 1
                    self._state["collect_seconds"] = round(time.monotonic() - started, 3)
                else:
                    new["collect_errors"] = prior_errors
                    new["collect_seconds"] = round(time.monotonic() - started, 3)
                    self._state = new
    
    
    class ConditionPublisher:
        """Mirrors evaluated conditions onto the Node object."""
    
        def __init__(self, cfg, collector, client_factory):
            self._cfg = cfg
            self._collector = collector
            self._client_factory = client_factory
            self._last_status = {}       # condition name -> "True"/"False"
            self._transitions = {}       # condition name -> RFC3339 of last flip
    
        def publish(self):
            detail = self._collector.state().get("condition_detail") or {}
            if not detail:
                return
    
            now = time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime())
            conditions = []
            for name in ALL_CONDITIONS:
                info = detail.get(name)
                if info is None:
                    continue
                status = "True" if info["active"] else "False"
                # Only advance lastTransitionTime when the status actually flipped,
                # so "how long has this node been broken" stays truthful. The guard
                # reads this field to decide whether a condition has persisted long
                # enough to act on, so a heartbeat must not reset it.
                if self._last_status.get(name) != status:
                    self._transitions[name] = now
                self._last_status[name] = status
    
                conditions.append({
                    "type": CONDITION_PREFIX + name,
                    "status": status,
                    "reason": info["reason"],
                    "message": info["message"][:1024],
                    "lastHeartbeatTime": now,
                    "lastTransitionTime": self._transitions[name],
                })
    
            try:
                self._client_factory().patch_node_status_conditions(
                    self._cfg.NODE_NAME, conditions
                )
            except K8sError as exc:
                LOG.error("failed to publish node conditions: %s", exc)
    
    
    class Handler(BaseHTTPRequestHandler):
        collector = None  # injected below
    
        def _send(self, code, body, content_type="text/plain; charset=utf-8"):
            payload = body.encode() if isinstance(body, str) else body
            self.send_response(code)
            self.send_header("Content-Type", content_type)
            self.send_header("Content-Length", str(len(payload)))
            self.end_headers()
            self.wfile.write(payload)
    
        def do_GET(self):
            path = self.path.split("?", 1)[0]
            if path == "/metrics":
                state = self.collector.state()
                self._send(200, metrics.render(Config.NODE_NAME, state))
            elif path in ("/healthz", "/readyz"):
                state = self.collector.state()
                fresh = (
                    state.get("collected_at", 0) > 0
                    and time.time() - state["collected_at"]
                    < max(60, Config.COLLECT_INTERVAL_SECONDS * 4)
                )
                self._send(200 if fresh else 503, "ok\n" if fresh else "stale\n")
            elif path == "/debug":
                self._send(
                    200,
                    json.dumps(self.collector.state(), indent=2, default=str),
                    "application/json",
                )
            else:
                self._send(404, "not found\n")
    
        def log_message(self, fmt, *args):
            # Default BaseHTTPRequestHandler logging writes every scrape to
            # stderr, which at a 15s scrape interval is pure noise.
            return
    
    
    def main():
        logging.basicConfig(
            level=logging.INFO,
            format="%(asctime)s %(levelname)s %(name)s %(message)s",
        )
        Config.validate()
    
        client_factory = LazyClient()
        collector = Collector(Config, client_factory)
        collector.start()
        collector.collect_once()
    
        Handler.collector = collector
        server = ThreadingHTTPServer((Config.LISTEN_ADDR, Config.LISTEN_PORT), Handler)
        threading.Thread(target=server.serve_forever, name="http", daemon=True).start()
        LOG.info(
            "serving on %s:%s for node %s",
            Config.LISTEN_ADDR, Config.LISTEN_PORT, Config.NODE_NAME,
        )
    
        publisher = (
            ConditionPublisher(Config, collector, client_factory)
            if Config.NODE_CONDITIONS_ENABLED else None
        )
        if publisher:
            LOG.info("node condition publishing ENABLED")
        else:
            LOG.info(
                "node condition publishing disabled (observer mode); "
                "set NODE_CONDITIONS_ENABLED=true to turn it on"
            )
    
        stop = threading.Event()
        for sig in (signal.SIGTERM, signal.SIGINT):
            signal.signal(sig, lambda *_: stop.set())
    
        last_publish = 0.0
        while not stop.is_set():
            collector.collect_once()
            if publisher and time.time() - last_publish >= Config.NODE_CONDITION_INTERVAL_SECONDS:
                publisher.publish()
                last_publish = time.time()
            stop.wait(Config.COLLECT_INTERVAL_SECONDS)
    
        LOG.info("shutting down")
        server.shutdown()
        return 0
    
    
    if __name__ == "__main__":
        sys.exit(main())
  metrics.py: |
    """Prometheus text exposition, hand-rolled.
    
    No prometheus_client dependency on purpose. This agent is meant to run on
    every GPU node in the fleet, including nodes that are already sick; the fewer
    moving parts between "read /proc" and "serve text", the fewer ways it has to
    become another thing that needs debugging during an incident. The exposition
    format is a handful of lines of string formatting.
    """
    
    from .signals.kernlog import RULES
    
    PREFIX = "gpuhealth"
    
    _SEVERITY_OF = {name: sev for name, _, sev in RULES}
    
    
    def _esc(value):
        """Escape a label value per the Prometheus exposition spec."""
        return (
            str(value)
            .replace("\\", "\\\\")
            .replace('"', '\\"')
            .replace("\n", "\\n")
        )
    
    
    class _Buf:
        def __init__(self, node):
            self._node = node
            self._lines = []
            self._declared = set()
    
        def metric(self, name, value, labels=None, mtype="gauge", help_text=""):
            full = f"{PREFIX}_{name}"
            if full not in self._declared:
                if help_text:
                    self._lines.append(f"# HELP {full} {help_text}")
                self._lines.append(f"# TYPE {full} {mtype}")
                self._declared.add(full)
    
            all_labels = {"node": self._node}
            all_labels.update(labels or {})
            rendered = ",".join(
                f'{k}="{_esc(v)}"' for k, v in all_labels.items()
            )
            if isinstance(value, bool):
                value = 1 if value else 0
            self._lines.append(f"{full}{{{rendered}}} {value}")
    
        def text(self):
            return "\n".join(self._lines) + "\n"
    
    
    def render(node, state):
        """Turn a collected state dict into exposition text."""
        b = _Buf(node)
    
        b.metric("agent_up", 1, help_text="1 while the agent is serving.")
        b.metric(
            "collect_timestamp_seconds", round(state.get("collected_at", 0), 3),
            help_text="Unix time of the last completed collection pass.",
        )
        b.metric(
            "collect_duration_seconds", state.get("collect_seconds", 0),
            help_text="Wall-clock seconds the last collection pass took.",
        )
        b.metric(
            "collect_errors_total", state.get("collect_errors", 0),
            mtype="counter",
            help_text="Collection passes that raised. Non-zero means this agent's "
                      "own data is suspect.",
        )
    
        # --- S1 kernel log ---------------------------------------------------
        kern = state.get("kernlog") or {}
        for rule, count in sorted((kern.get("counts") or {}).items()):
            b.metric(
                "kernlog_events_total", count,
                labels={"rule": rule, "severity": _SEVERITY_OF.get(rule, "unknown")},
                mtype="counter",
                help_text="Kernel-log signature hits since agent start.",
            )
        for rule, (ts, _line) in sorted((kern.get("last_hit") or {}).items()):
            b.metric(
                "kernlog_last_event_timestamp_seconds", round(ts, 3),
                labels={"rule": rule},
                help_text="Unix time of the most recent hit for this signature.",
            )
        for path, ok in sorted((kern.get("files_ok") or {}).items()):
            b.metric(
                "kernlog_file_readable", ok, labels={"path": path},
                help_text="0 means the agent cannot read this log file, so every "
                          "kernel-log signal from this node is blind.",
            )
    
        # --- S2 D-state ------------------------------------------------------
        d = state.get("dstate") or {}
        b.metric(
            "proc_readable", d.get("readable", False),
            help_text="0 means /proc is unreadable and the D-state census is blind.",
        )
        for scope, total_key, stuck_key, max_key in (
            ("all", "total", "stuck", "max_seconds"),
            ("gpu_worker", "gpu_total", "gpu_stuck", "gpu_max_seconds"),
        ):
            b.metric(
                "dstate_processes", d.get(total_key, 0), labels={"scope": scope},
                help_text="Processes currently in uninterruptible sleep.",
            )
            b.metric(
                "dstate_stuck_processes", d.get(stuck_key, 0), labels={"scope": scope},
                help_text="Processes in D for longer than the stuck threshold.",
            )
            b.metric(
                "dstate_max_seconds", d.get(max_key, 0), labels={"scope": scope},
                help_text="Longest continuous time any process has spent in D.",
            )
    
        # --- S4 AMD exporter --------------------------------------------------
        e = state.get("exporter") or {}
        b.metric(
            "exporter_reachable", e.get("reachable", False),
            help_text="0 means the node-local AMD device-metrics-exporter did not "
                      "answer.",
        )
        b.metric("exporter_scrape_seconds", e.get("scrape_seconds", 0))
        b.metric("exporter_gpu_total", e.get("gpu_total", 0))
        b.metric(
            "exporter_gpu_unhealthy", len(e.get("unhealthy") or []),
            help_text="GPUs the AMD exporter reports as unhealthy.",
        )
        for u in e.get("unhealthy") or []:
            b.metric(
                "exporter_gpu_unhealthy_info", 1,
                labels={
                    "gpu_id": u.get("gpu_id", "?"),
                    "namespace": u.get("namespace", ""),
                    "pod": u.get("pod", ""),
                    "container": u.get("container", ""),
                },
                help_text="One series per unhealthy GPU, carrying the tenant "
                          "workload currently occupying it.",
            )
    
        # --- S5 patch counters ------------------------------------------------
        p = state.get("patch") or {}
        b.metric(
            "patch_counters_present", p.get("present", False),
            help_text="1 when this node exposes amdgpu D1-D7 patch counters.",
        )
        for name, value in sorted((p.get("counters") or {}).items()):
            b.metric(f"patch_{name}", value, mtype="counter")
    
        # --- derived conditions ----------------------------------------------
        for name, active in sorted((state.get("conditions") or {}).items()):
            b.metric(
                "condition", 1 if active else 0, labels={"condition": name},
                help_text="1 while this node health condition is asserted.",
            )
    
        return b.text()
