data:
  dstate.py: |
    """S2: census of processes in uninterruptible sleep (state D).
    
    This is the cheapest early warning available for the failure mode that took
    down nodes 0006 and 0029. When the TTM delayed-delete workqueue blocks on a
    fence that will never signal, its kernel worker threads (kworker/u266:*,
    kworker/u267:*, typically with a "+ttm" suffix) sit in D forever. The node
    keeps reporting Ready, the device plugin keeps advertising 8 healthy GPUs, and
    the scheduler keeps placing new tenants onto it.
    
    Nothing about this requires talking to the GPU, so it works even when every
    GPU interface is already wedged - which is exactly when it is needed.
    """
    
    import os
    import time
    
    
    def _read_stat(proc_path, pid):
        """Return (comm, state, starttime) for a pid, or None if it is gone.
    
        /proc/<pid>/stat cannot be split on whitespace: comm is wrapped in
        parentheses and may itself contain spaces and parentheses (kernel worker
        names like "kworker/u266:10+ttm" are tame, but userspace can be hostile).
        The reliable parse is to cut at the LAST ')'.
        """
        try:
            with open(os.path.join(proc_path, str(pid), "stat"), "rb") as fh:
                raw = fh.read().decode("utf-8", errors="replace")
        except (FileNotFoundError, ProcessLookupError, PermissionError, OSError):
            return None
    
        close = raw.rfind(")")
        open_paren = raw.find("(")
        if close == -1 or open_paren == -1 or close < open_paren:
            return None
    
        comm = raw[open_paren + 1:close]
        rest = raw[close + 2:].split()
        if len(rest) < 20:
            return None
    
        state = rest[0]
        try:
            # Field 22 overall; `rest` begins at field 3, so index 19.
            starttime = int(rest[19])
        except ValueError:
            return None
        return comm, state, starttime
    
    
    class DStateCensus:
        """Tracks how long each process has been continuously in state D.
    
        Processes are keyed by (pid, starttime) rather than pid alone so that pid
        reuse cannot be misread as a process that has been stuck for hours.
        """
    
        def __init__(self, proc_path, stuck_seconds, gpu_comm_prefixes):
            self._proc_path = proc_path
            self._stuck_seconds = stuck_seconds
            self._gpu_prefixes = tuple(gpu_comm_prefixes)
            self._since = {}  # (pid, starttime) -> unix ts first seen in D
    
        def _is_gpu_worker(self, comm):
            return any(comm.startswith(p) for p in self._gpu_prefixes)
    
        def collect(self):
            now = time.time()
            try:
                pids = [e for e in os.listdir(self._proc_path) if e.isdigit()]
            except OSError:
                return {
                    "total": 0, "stuck": 0, "gpu_total": 0, "gpu_stuck": 0,
                    "max_seconds": 0.0, "gpu_max_seconds": 0.0,
                    "readable": False, "offenders": [],
                }
    
            seen = set()
            total = stuck = gpu_total = gpu_stuck = 0
            max_secs = gpu_max_secs = 0.0
            offenders = []
    
            for pid in pids:
                info = _read_stat(self._proc_path, pid)
                if info is None:
                    continue
                comm, state, starttime = info
                if state != "D":
                    continue
    
                key = (pid, starttime)
                seen.add(key)
                first = self._since.setdefault(key, now)
                secs = now - first
    
                total += 1
                max_secs = max(max_secs, secs)
                is_gpu = self._is_gpu_worker(comm)
                if is_gpu:
                    gpu_total += 1
                    gpu_max_secs = max(gpu_max_secs, secs)
    
                if secs >= self._stuck_seconds:
                    stuck += 1
                    if is_gpu:
                        gpu_stuck += 1
                    offenders.append(
                        {"pid": int(pid), "comm": comm,
                         "seconds": round(secs, 1), "gpu_worker": is_gpu}
                    )
    
            # Forget processes that left D or exited, so a later reappearance is
            # timed from scratch rather than inheriting a stale start time.
            for key in list(self._since):
                if key not in seen:
                    del self._since[key]
    
            # Longest-stuck first; the head of this list is what an operator needs.
            offenders.sort(key=lambda o: o["seconds"], reverse=True)
    
            return {
                "total": total,
                "stuck": stuck,
                "gpu_total": gpu_total,
                "gpu_stuck": gpu_stuck,
                "max_seconds": round(max_secs, 1),
                "gpu_max_seconds": round(gpu_max_secs, 1),
                "readable": True,
                "offenders": offenders[:20],
            }
  exporter.py: |
    """S4: probe the node-local AMD device-metrics-exporter.
    
    The AMD GPU operator already runs `default-metrics-exporter` on every node
    carrying feature.node.kubernetes.io/amd-gpu=true. It works: it serves ~691
    metric lines on :5000 including gpu_health and, via the kubelet pod-resources
    API, a GPU -> namespace/pod/container correlation.
    
    What was missing is that nothing ever scraped it -
    DeviceConfig.metricsExporter.prometheus.serviceMonitor.enable is false, the
    cluster has no prometheus-operator CRDs, and VictoriaMetrics runs with no
    scrape configuration at all. That is the whole of the "health data chain was
    never established" finding.
    
    The bulk scrape is vmagent's job (deploy/vmagent.yaml). This module only
    answers two questions the agent needs for its own conditions:
    
      1. Is the exporter actually answering on this node right now?
      2. Which GPUs does it consider unhealthy, and who is sitting on them?
    
    gpu_health is NOT treated as sufficient on its own. Its judgement is driven by
    ECC/RAS and topology state, which is unlikely to move during a fence/MES
    stall - every GPU on this fleet reports gpu_health=1 today. It is a useful
    corroborating signal and the source of tenant attribution, not a hang detector.
    """
    
    import re
    import time
    import urllib.error
    import urllib.request
    
    # Matches a Prometheus sample line, splitting the label set from the value.
    _SAMPLE = re.compile(r"^(?P<name>[a-zA-Z_:][a-zA-Z0-9_:]*)\{(?P<labels>.*)\}\s+(?P<value>\S+)\s*$")
    _LABEL = re.compile(r'(?P<k>[a-zA-Z_][a-zA-Z0-9_]*)="(?P<v>(?:[^"\\]|\\.)*)"')
    
    
    def _parse_labels(raw):
        return {m.group("k"): m.group("v").replace('\\"', '"') for m in _LABEL.finditer(raw)}
    
    
    class NodeLocalEndpointResolver:
        """Resolve the exporter pod running on this specific node.
    
        `default-metrics-exporter` is a ClusterIP Service in front of a DaemonSet,
        and the exporter pods are NOT hostNetwork. Scraping the Service address
        would land on an arbitrary node's exporter, so the agent would cheerfully
        report a healthy neighbour's GPUs as its own - exactly the class of
        silent misattribution this project exists to remove.
    
        The resolved pod IP is cached and re-resolved whenever a scrape fails, so
        an exporter pod restart (new IP) self-heals within one collection cycle
        without hammering the API server on the happy path.
        """
    
        def __init__(self, client_factory, namespace, service, node_name, port, path):
            self._client_factory = client_factory
            self._ns = namespace
            self._svc = service
            self._node = node_name
            self._port = port
            self._path = path
            self._cached = None
    
        def invalidate(self):
            self._cached = None
    
        def url(self):
            if self._cached:
                return self._cached
            slices = self._client_factory().list_endpointslices(self._ns, self._svc)
            for sl in slices.get("items", []):
                for ep in sl.get("endpoints", []):
                    if ep.get("nodeName") != self._node:
                        continue
                    if not (ep.get("conditions") or {}).get("ready", True):
                        continue
                    for addr in ep.get("addresses", []):
                        self._cached = f"http://{addr}:{self._port}{self._path}"
                        return self._cached
            raise LookupError(
                f"no ready {self._ns}/{self._svc} endpoint on node {self._node}"
            )
    
    
    class ExporterProbe:
        def __init__(self, url, timeout, resolver=None):
            """`url` pins a fixed endpoint; `resolver` discovers the node-local one.
    
            A fixed URL wins when set, which keeps local testing and hostNetwork
            deployments trivial. Otherwise the resolver is consulted.
            """
            self._url = url
            self._timeout = timeout
            self._resolver = resolver
    
        def collect(self):
            started = time.monotonic()
            url = ""
            try:
                # Surfaced in /debug as "url": an operator checking whether a node
                # is scraping its OWN exporter should not have to exec into the
                # pod and re-run the resolver by hand.
                url = self._url or self._resolver.url()
                with urllib.request.urlopen(url, timeout=self._timeout) as resp:
                    body = resp.read().decode("utf-8", errors="replace")
                elapsed = time.monotonic() - started
            except Exception as exc:  # noqa: BLE001
                # Deliberately broad: urllib errors, OSError, and K8sError/LookupError
                # from the endpoint resolver all mean the same thing here. Any
                # failure to reach the exporter is reported as unreachable rather
                # than raised: a probe that cannot answer must say so, never stay
                # silent.
                if self._resolver is not None:
                    self._resolver.invalidate()
                return {
                    "reachable": False,
                    "error": str(exc)[:200],
                    "url": url,
                    "scrape_seconds": round(time.monotonic() - started, 3),
                    "gpu_total": 0,
                    "healthy": 0,
                    "unhealthy": [],
                }
    
            healthy = 0
            unhealthy = []
            gpu_total = 0
    
            for line in body.splitlines():
                if line.startswith("#") or not line:
                    continue
                m = _SAMPLE.match(line)
                if not m:
                    continue
                name = m.group("name")
    
                if name == "gpu_nodes_total":
                    try:
                        gpu_total = int(float(m.group("value")))
                    except ValueError:
                        pass
                    continue
    
                if name != "gpu_health":
                    continue
    
                try:
                    value = float(m.group("value"))
                except ValueError:
                    continue
                labels = _parse_labels(m.group("labels"))
                if value >= 1.0:
                    healthy += 1
                else:
                    # Carry the tenant attribution through: when a GPU goes bad we
                    # want to name the affected pod in the alert, not just the card.
                    unhealthy.append({
                        "gpu_id": labels.get("gpu_id", "?"),
                        "namespace": labels.get("namespace", ""),
                        "pod": labels.get("pod", ""),
                        "container": labels.get("container", ""),
                    })
    
            return {
                "reachable": True,
                "error": "",
                "url": url,
                "scrape_seconds": round(elapsed, 3),
                "gpu_total": gpu_total,
                "healthy": healthy,
                "unhealthy": unhealthy,
            }
  __init__.py: |
    """Signal collectors. Each module answers one question about node health."""
  kernlog.py: |
    """S1: follow persistent kernel logs and count GPU fault signatures.
    
    Deliberately reads /var/log/kern.log and /var/log/syslog rather than dmesg.
    dmesg is a fixed-size ring buffer; on this fleet (uptimes up to 38 weeks) it
    had already wrapped by the time the August GPU hangs were investigated, and
    the only surviving evidence was in the rotated files on disk. An agent that
    reads dmesg would silently observe nothing on exactly the nodes that matter
    most.
    
    Rotation is handled by tracking (st_dev, st_ino): when logrotate swaps the
    file out we finish reading the old handle, then reopen from offset 0.
    """
    
    import os
    import re
    import threading
    import time
    
    # Each rule maps a kernel-log regex to a stable metric label and a severity.
    #
    # "fatal"   - the node is in or entering an unrecoverable GPU state
    # "warning" - a recoverable fault, meaningful when it recurs
    # "patch"   - instrumentation emitted by the D1-D7 amdgpu patch set; counted so
    #             the patch can be judged on evidence instead of on its author's
    #             say-so. These never drive node conditions on their own.
    RULES = [
        # --- fatal ----------------------------------------------------------
        ("mes_unrecoverable", r"MES might be in unrecoverable state", "fatal"),
        ("gpu_reset_begin", r"GPU reset begin", "fatal"),
        ("vram_lost", r"VRAM is lost due to GPU reset", "fatal"),
        # A hung-task report naming a GPU/TTM workqueue worker. This was the ONLY
        # early signal present on node 0006 before it became unrecoverable, and
        # nothing in the cluster was watching for it.
        (
            "gpu_workqueue_blocked",
            r"kworker/u\d+:\d+.*blocked for more than \d+ seconds",
            "fatal",
        ),
        # --- warning --------------------------------------------------------
        ("ring_timeout", r"ring \S+ timeout", "warning"),
        ("job_timedout", r"job timedout", "warning"),
        ("gpu_reset_succeeded", r"GPU reset\(\d+\) succeeded|GPU reset succeeded", "warning"),
        ("vm_fault", r"amdgpu:.*VM_L2_PROTECTION_FAULT|amdgpu.*page fault", "warning"),
        # A hung task that is NOT a GPU workqueue worker - tracked separately so a
        # busy NFS mount does not masquerade as a GPU fault.
        ("other_task_blocked", r"blocked for more than \d+ seconds", "warning"),
        # --- patch instrumentation ------------------------------------------
        ("d4_watchdog", r"D4 watchdog: fence context .* stalled", "patch"),
        ("d1_remediate", r"D1 remediate: force-signal", "patch"),
        ("ttm_giving_up", r"ttm: BO .* GIVING UP", "patch"),
        ("d3_failover", r"D3: .*failover", "patch"),
    ]
    
    _COMPILED = [(name, re.compile(pat), sev) for name, pat, sev in RULES]
    
    # Ordering matters for the two blocked-task rules: the GPU-specific one must
    # win. _match returns on the first hit, and RULES lists it first.
    
    
    class KernelLogWatcher:
        """Tails the configured log files in a background thread."""
    
        def __init__(self, paths, from_start=False):
            self._paths = list(paths)
            self._from_start = from_start
            self._lock = threading.Lock()
            self._counts = {name: 0 for name, _, _ in RULES}
            self._last_hit = {}          # rule name -> (unix_ts, raw line)
            self._files_ok = {}          # path -> bool, for self-diagnosis
            self._stop = threading.Event()
            self._thread = None
    
        # -- public surface ---------------------------------------------------
    
        def start(self):
            self._thread = threading.Thread(
                target=self._run, name="kernlog", daemon=True
            )
            self._thread.start()
    
        def stop(self):
            self._stop.set()
    
        def snapshot(self):
            """Counts since agent start, plus the last raw line per rule."""
            with self._lock:
                return {
                    "counts": dict(self._counts),
                    "last_hit": dict(self._last_hit),
                    "files_ok": dict(self._files_ok),
                }
    
        def severity_counts(self):
            """Total hits grouped by severity, for condition evaluation."""
            snap = self.snapshot()["counts"]
            out = {"fatal": 0, "warning": 0, "patch": 0}
            for name, _, sev in RULES:
                out[sev] += snap.get(name, 0)
            return out
    
        # -- internals --------------------------------------------------------
    
        def _run(self):
            handles = {}  # path -> (file object, st_dev, st_ino)
            while not self._stop.is_set():
                for path in self._paths:
                    try:
                        self._pump(path, handles)
                        ok = True
                    except FileNotFoundError:
                        ok = False
                    except OSError:
                        ok = False
                    with self._lock:
                        self._files_ok[path] = ok
                self._stop.wait(1.0)
            for fh, _, _ in handles.values():
                try:
                    fh.close()
                except OSError:
                    pass
    
        def _pump(self, path, handles):
            st = os.stat(path)
            entry = handles.get(path)
    
            if entry is not None:
                fh, dev, ino = entry
                rotated = (dev, ino) != (st.st_dev, st.st_ino)
                truncated = fh.tell() > st.st_size
                if rotated or truncated:
                    # Drain whatever is left in the old handle before letting go of
                    # it, so lines written between our last read and the rotation
                    # are not lost.
                    if rotated:
                        self._consume(fh)
                    fh.close()
                    entry = None
    
            if entry is None:
                fh = open(path, "r", errors="replace")
                if not self._from_start and path not in handles:
                    # First sight of this file: skip the backlog. Historical
                    # analysis belongs to the log-shipping pipeline, not to a
                    # liveness agent that would otherwise replay months of old
                    # faults as if they were happening now.
                    fh.seek(0, os.SEEK_END)
                st = os.fstat(fh.fileno())
                handles[path] = (fh, st.st_dev, st.st_ino)
                entry = handles[path]
    
            self._consume(entry[0])
    
        def _consume(self, fh):
            while True:
                line = fh.readline()
                if not line:
                    return
                self._match(line.rstrip("\n"))
    
        def _match(self, line):
            for name, rx, _sev in _COMPILED:
                if rx.search(line):
                    with self._lock:
                        self._counts[name] += 1
                        self._last_hit[name] = (time.time(), line[-400:])
                    return
  patchctr.py: |
    """S5: read amdgpu patch-set counters exposed through sysfs.
    
    Only nodes carrying the D1-D7 patch set have these. Their absence is normal
    and is reported as "present: False", never as an error.
    
    Why this exists: the D4 watchdog and D1 remediation paths are, as of the
    validation campaign so far, never-executed code. Two full stress phases
    (saturated VRAM at production thresholds, and rolling SIGKILL at 1/15 of
    production thresholds) produced D4_watchdog_hits=0 and D1_remediate_hits=0.
    Until those counters move under a reproduced fault, the patch's efficacy is
    unevidenced. Counting them as first-class metrics - rather than grepping logs
    after an incident - is what makes that judgement possible.
    
    The kernel side does not export these yet. Until it does, `present` stays
    False and the log-derived counters in signals/kernlog.py ("patch" severity)
    are the fallback, at lower fidelity.
    """
    
    import os
    
    # Counter files we look for, mapped to the metric suffix we publish.
    KNOWN_COUNTERS = {
        "d4_watchdog_fired_total": "d4_watchdog_fired_total",
        "d1_remediate_fences_total": "d1_remediate_fences_total",
        "ttm_delete_giveup_total": "ttm_delete_giveup_total",
        "ttm_delete_leaked_bytes": "ttm_delete_leaked_bytes",
        "d3_failover_total": "d3_failover_total",
    }
    
    
    class PatchCounters:
        def __init__(self, path):
            self._path = path
    
        def collect(self):
            if not os.path.isdir(self._path):
                return {"present": False, "counters": {}}
    
            counters = {}
            for fname, metric in KNOWN_COUNTERS.items():
                full = os.path.join(self._path, fname)
                try:
                    with open(full, "r") as fh:
                        counters[metric] = int(fh.read().strip())
                except (FileNotFoundError, NotADirectoryError):
                    continue
                except (OSError, ValueError):
                    # Present but unreadable/garbled is worth distinguishing from
                    # absent: it means the interface changed under us.
                    counters[metric] = -1
    
            return {"present": bool(counters), "counters": counters}
